name: UMX feature request
description: Propose an improvement specific to the WaterWoods UMX integration.
title: "[UMX Feature]: "
body:
  - type: checkboxes
    id: routing
    attributes:
      label: Scope
      options:
        - label: This request is specific to UMX and does not belong in official Freqtrade.
          required: true
        - label: I searched existing WaterWoods issues and pull requests for the same request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the operational or integration problem without including private account data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: affected_mode
    attributes:
      label: Affected mode
      multiple: true
      options:
        - Spot
        - USDT perpetual futures
        - Market data
        - Orders and fills
        - Positions, leverage, or liquidation
        - CI, release, or maintenance
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Trading-safety and compatibility impact
      description: Explain dry-run validation, live-trading risk, and compatibility with upstream Freqtrade.
    validations:
      required: true
