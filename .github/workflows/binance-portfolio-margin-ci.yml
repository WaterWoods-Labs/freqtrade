name: Binance Portfolio Margin CI

on:
  pull_request:
    branches:
      - binance-portfolio-margin
  push:
    branches:
      - binance-portfolio-margin
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete Freqtrade test suite
        required: false
        default: false
        type: boolean

concurrency:
  group: binance-portfolio-margin-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused:
    name: Focused Binance Portfolio Margin validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: "requirements**.txt"

      - name: Install dependencies
        run: |
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Enforce product boundary
        run: python scripts/validate_binance_portfolio_margin_boundary.py

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Run focused configuration, Binance, bot, RPC, and PAPI tests
        run: |
          pytest -q \
            tests/test_binance_portfolio_margin_boundary.py \
            tests/test_configuration.py \
            tests/exchange/test_binance.py \
            tests/freqtradebot/test_freqtradebot.py \
            tests/rpc/test_rpc.py

  full:
    name: Full upstream compatibility
    if: >-
      ${{
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.full) ||
        (
          github.event_name == 'pull_request' &&
          github.head_ref == 'sync/binance-portfolio-margin-upstream-develop'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: "requirements**.txt"

      - name: Install dependencies
        run: |
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Enforce product boundary
        run: python scripts/validate_binance_portfolio_margin_boundary.py

      - name: Run complete test suite
        run: pytest --random-order -n auto

  required:
    name: binance-portfolio-margin-required
    if: always()
    needs:
      - focused
      - full
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        env:
          FOCUSED_RESULT: ${{ needs.focused.result }}
          FULL_RESULT: ${{ needs.full.result }}
        run: |
          test "$FOCUSED_RESULT" = "success"
          test "$FULL_RESULT" = "success" -o "$FULL_RESULT" = "skipped"
