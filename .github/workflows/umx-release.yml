name: Publish UMX image

on:
  push:
    tags:
      - "umx-*"

concurrency:
  group: umx-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/waterwoods-labs/freqtrade-umx

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag belongs to umx
        run: |
          git fetch origin umx
          git merge-base --is-ancestor "$GITHUB_SHA" origin/umx

      - name: Verify full UMX CI passed for the release SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/umx-ci.yml/runs" \
              -f branch=umx \
              -f event=push \
              -f head_sha="$GITHUB_SHA" \
              -f status=completed \
              -F per_page=100 \
              --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty'
          )"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error title=Release blocked::No successful UMX CI push run exists for $GITHUB_SHA"
            {
              echo "## UMX release blocked"
              echo
              echo "No successful UMX CI push run was found for exact SHA \`$GITHUB_SHA\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          full_job_id="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
              -f filter=latest \
              -F per_page=100 \
              --jq '[.jobs[] | select(.name == "Full upstream compatibility" and .conclusion == "success")][0].id // empty'
          )"
          if [[ ! "$full_job_id" =~ ^[0-9]+$ ]]; then
            echo "::error title=Release blocked::UMX CI run $run_id did not complete the full job successfully"
            {
              echo "## UMX release blocked"
              echo
              echo "UMX CI run [$run_id]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id) did not contain a successful \`Full upstream compatibility\` job."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "### Exact-SHA UMX CI gate"
            echo
            echo "UMX CI run [$run_id]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id) passed its full job for \`$GITHUB_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select dependency-preserving adapter build
        id: recipe
        shell: bash
        run: |
          # Any other runtime/dependency change uses the normal complete build.
          recipe=Dockerfile
          if git diff --quiet 65c2fac9183affe4b2f253a6671684d49c4bdcb8 "$GITHUB_SHA" -- \
            . ':!freqtrade/exchange/umx.py' ':!tests/**' ':!docs/**' \
            ':!.github/workflows/umx-release.yml' ':!Dockerfile.umx-hotfix'; then
            recipe=Dockerfile.umx-hotfix
          fi
          echo "file=$recipe" >> "$GITHUB_OUTPUT"

      - name: Read reviewed release platforms
        id: platforms
        shell: bash
        run: |
          set -euo pipefail
          platforms=$(jq -cer '.platforms | select(type == "array" and length > 0 and length <= 2) | select(index("linux/amd64") != null) | select(all(.[]; . == "linux/amd64" or . == "linux/arm64")) | select(length == (unique | length)) | join(",")' .github/release-platforms.json)
          echo "value=$platforms" >> "$GITHUB_OUTPUT"
          echo "Reviewed platforms: $platforms" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish immutable images
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ${{ steps.recipe.outputs.file }}
          platforms: ${{ steps.platforms.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          push: true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Attest the published image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish release notes with digest
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --notes "Container image: ${IMAGE_NAME}@${DIGEST}"

      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### UMX image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE_NAME}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
