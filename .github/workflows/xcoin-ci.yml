name: XCoin CI

on:
  pull_request:
    branches:
      - xcoin
  push:
    branches:
      - xcoin
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete Freqtrade test suite
        required: false
        default: false
        type: boolean

concurrency:
  group: xcoin-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused:
    name: Focused validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce XCoin-only product boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/develop:refs/remotes/origin/develop

          if ! git diff --quiet origin/develop -- freqtrade/exchange/binance.py; then
            echo "::error title=XCoin product boundary violation::freqtrade/exchange/binance.py differs from origin/develop"
            git diff --stat origin/develop -- freqtrade/exchange/binance.py
            {
              echo "## XCoin product boundary violation"
              echo
              echo '`freqtrade/exchange/binance.py` must remain identical to `origin/develop`.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          forbidden_markers='portfolio_margin_risk|_portfolio_algo_request|_portfolio_margin_params|portfolio_margin_enabled|portfolio_margin_unknown_order_latched|cleanup_portfolio_margin_unknown_conditional_order|is_portfolio_margin_position_flat|papi(Get|Post|Delete)(Um|Cm|Margin)|Binance Portfolio Margin'
          if matches="$(git grep -n -E "$forbidden_markers" -- freqtrade tests build_helpers/schema.json)"; then
            echo "::error title=XCoin product boundary violation::WaterWoods Binance PAPI markers were found"
            printf '%s\n' "$matches"
            {
              echo "## XCoin product boundary violation"
              echo
              echo "WaterWoods Binance PAPI markers were found:"
              echo '```text'
              printf '%s\n' "$matches"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "### XCoin product boundary"
            echo
            echo '- `freqtrade/exchange/binance.py` matches `origin/develop`.'
            echo '- No WaterWoods Binance PAPI markers were found.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: "requirements**.txt"

      - name: Install dependencies
        run: |
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Run focused XCoin tests
        run: |
          pytest -q \
            tests/exchange/test_xcoin.py \
            tests/freqtradebot/test_freqtradebot.py \
            tests/persistence/test_migrations.py \
            tests/persistence/test_persistence.py \
            tests/rpc/test_rpc.py

  full:
    name: Full upstream compatibility
    if: >-
      ${{
        (github.event_name == 'push' && github.ref == 'refs/heads/xcoin') ||
        (github.event_name == 'workflow_dispatch' && inputs.full) ||
        (github.event_name == 'pull_request' && github.head_ref == 'sync/upstream-develop')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          activate-environment: true
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: "requirements**.txt"

      - name: Install dependencies
        run: |
          uv pip install -r requirements-dev.txt
          uv pip install -e ft_client/
          uv pip install -e .

      - name: Run complete test suite
        run: pytest --random-order -n auto

  required:
    name: required
    if: always()
    needs:
      - focused
      - full
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        env:
          FOCUSED_RESULT: ${{ needs.focused.result }}
          FULL_RESULT: ${{ needs.full.result }}
        run: |
          test "$FOCUSED_RESULT" = "success"
          test "$FULL_RESULT" = "success" -o "$FULL_RESULT" = "skipped"
