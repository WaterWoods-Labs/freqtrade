name: Publish Binance Portfolio Margin image

on:
  push:
    tags:
      - "binance-portfolio-margin-*"

concurrency:
  group: binance-portfolio-margin-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/waterwoods-labs/freqtrade-binance-portfolio-margin

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release tag and product branch
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^binance-portfolio-margin-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid release tag::Tag must match binance-portfolio-margin-YYYY.MM.DD.N"
            exit 1
          fi

          git fetch --no-tags origin binance-portfolio-margin
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/binance-portfolio-margin

      - name: Verify complete CI for the exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t run_ids < <(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&status=completed&per_page=100" \
              --jq ".workflow_runs[] | select(
                .path == \".github/workflows/binance-portfolio-margin-ci.yml\" and
                .head_sha == \"${GITHUB_SHA}\" and
                .head_branch == \"binance-portfolio-margin\" and
                .event == \"push\" and
                .conclusion == \"success\"
              ) | .id"
          )

          verified_run=""
          for run_id in "${run_ids[@]}"; do
            mapfile -t full_jobs < <(
              gh api --paginate \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=all&per_page=100" \
                --jq '.jobs[] | select(
                  .name == "Full upstream compatibility" and
                  .conclusion == "success"
                ) | .id'
            )
            if [ "${#full_jobs[@]}" -gt 0 ]; then
              verified_run="$run_id"
              break
            fi
          done

          if [ -z "$verified_run" ]; then
            echo "::error title=Complete CI not found::The exact release SHA must have a successful push run whose Full upstream compatibility job succeeded."
            exit 1
          fi
          echo "Verified complete CI run ${verified_run} for ${GITHUB_SHA}."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish immutable images
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest the published image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish release notes with digest
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "Container image: ${IMAGE_NAME}@${DIGEST}"

      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### Binance Portfolio Margin image" >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
