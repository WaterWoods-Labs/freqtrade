name: Prepare XCoin upstream sync

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-xcoin-upstream
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge the official mirror into a sync branch
        id: merge
        env:
          FALLBACK_TOKEN: ${{ github.token }}
          MIRROR_SYNC_TOKEN: ${{ secrets.MIRROR_SYNC_TOKEN }}
        run: |
          if [ -n "$MIRROR_SYNC_TOKEN" ]; then
            export GH_TOKEN="$MIRROR_SYNC_TOKEN"
            echo "Using the dedicated mirror synchronization token for Git pushes"
          else
            export GH_TOKEN="$FALLBACK_TOKEN"
            echo "Using GITHUB_TOKEN; workflow-file updates require MIRROR_SYNC_TOKEN"
          fi

          gh auth setup-git
          git fetch --prune origin xcoin develop

          if git merge-base --is-ancestor origin/develop origin/xcoin; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "xcoin already contains origin/develop"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C sync/upstream-develop origin/xcoin
          git merge --no-ff origin/develop -m "Merge upstream develop into XCoin"

          workflow_changes="$(git diff --name-only origin/xcoin..HEAD -- .github/workflows/)"
          if [ -n "$workflow_changes" ] && [ -z "$MIRROR_SYNC_TOKEN" ]; then
            echo "::error title=Mirror token required::The upstream merge changes workflow files. Configure MIRROR_SYNC_TOKEN with Contents and Workflows write permissions."
            printf 'Workflow files requiring the dedicated token:\n%s\n' "$workflow_changes"
            exit 1
          fi

          if ! git push --force-with-lease origin HEAD:refs/heads/sync/upstream-develop; then
            echo "::error title=Synchronization branch push failed::Could not update sync/upstream-develop"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update the synchronization pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh pr list \
            --base xcoin \
            --head sync/upstream-develop \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$number" ]; then
            gh pr create \
              --base xcoin \
              --head sync/upstream-develop \
              --title "Merge upstream develop into XCoin" \
              --body "Automated upstream synchronization. This pull request is never merged automatically and requires XCoin CI."
          fi

      - name: Dispatch the full XCoin validation
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run xcoin-ci.yml --ref sync/upstream-develop -f full=true
