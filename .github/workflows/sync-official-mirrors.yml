name: Sync official mirror branches

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

concurrency:
  group: sync-official-mirrors
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create mirror synchronization token
        id: mirror-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MIRROR_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.MIRROR_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Fast-forward official mirror branches
        env:
          GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
        run: |
          gh auth setup-git
          git remote add upstream https://github.com/freqtrade/freqtrade.git
          git fetch --prune upstream develop stable
          git fetch --prune origin develop stable

          failed=0
          for branch in develop stable; do
            current="$(git rev-parse "origin/$branch")"
            target="$(git rev-parse "upstream/$branch")"

            if [ "$current" = "$target" ]; then
              echo "$branch is up to date at $current"
            elif git merge-base --is-ancestor "$current" "$target"; then
              if git push origin "upstream/$branch:refs/heads/$branch"; then
                echo "$branch fast-forwarded from $current to $target"
              else
                echo "::error title=Mirror push failed::Could not fast-forward $branch from $current to $target"
                failed=1
              fi
            else
              echo "::error::$branch diverged: origin=$current upstream=$target"
              failed=1
            fi
          done

          exit "$failed"

      - name: Record the synchronization failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Official mirror synchronization failed"
          {
            echo "### Official mirror synchronization failed"
            echo
            echo "No mirror history was rewritten. Inspect the failed run: $RUN_URL"
            echo
            echo "If authentication failed, verify the mirror-sync GitHub App installation, \`MIRROR_SYNC_APP_CLIENT_ID\` variable, and \`MIRROR_SYNC_APP_PRIVATE_KEY\` secret."
          } >> "$GITHUB_STEP_SUMMARY"

          if ! existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty' 2>&1)"; then
            echo "::warning title=Issue notification unavailable::Could not query maintenance issues; the job summary contains the failure details."
            printf '%s\n' "$existing"
            exit 0
          fi

          if [ -z "$existing" ]; then
            if ! output="$(gh issue create \
              --title "$title" \
              --body "The develop or stable mirror could not be fast-forwarded. No history was rewritten. Inspect: $RUN_URL" 2>&1)"; then
              echo "::warning title=Issue notification unavailable::Could not create the maintenance issue; the job summary contains the failure details."
              printf '%s\n' "$output"
            fi
          else
            if ! output="$(gh issue comment "$existing" --body "The mirror synchronization failed again. Inspect: $RUN_URL" 2>&1)"; then
              echo "::warning title=Issue notification unavailable::Could not update maintenance issue #$existing; the job summary contains the failure details."
              printf '%s\n' "$output"
            fi
          fi
