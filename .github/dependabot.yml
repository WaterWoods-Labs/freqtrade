version: 2
updates:
  - package-ecosystem: docker # zizmor: ignore[dependabot-cooldown] Docker does not support cooldowns.
    directories:
      - "/"
      - "/docker"
    schedule:
      interval: weekly
    # Ordinary version updates arrive through the clean upstream mirrors.
    # Zero keeps security updates enabled without creating fork-only version PRs.
    open-pull-requests-limit: 0

  - package-ecosystem: devcontainers
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
